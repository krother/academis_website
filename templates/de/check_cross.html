{% extends 'base.html' %}

{% block title %}Check &amp; Cross{% endblock %}

{% block content %}

  <style>
    #card_canvas {
      border: 1px solid #888;
      background-color: #cccccc;
      display: none;
    }
    #setup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
  </style>

<section class="d-flex flex-column align-items-center text-center">

  <h1>Check &amp; Cross</h1>

  <div id="setup">
    <textarea id="word_input" rows="12"
      class="form-control fs-5 p-3 shadow-sm"
      style="width: 20rem; resize: vertical;">
Mittelwert
Median
Modus
Quartil
Standardabweichung
Spannweite
Kategorie
Ordinal
Variable
Pivot</textarea>
    <button class="btn btn-success px-5" id="start_btn">Start</button>
  </div>

  <canvas id="card_canvas" width="1200" height="800"></canvas>

  <script src="{{ asset_prefix }}static/js/check_cross.js"></script>

</section>

{% endblock %}
