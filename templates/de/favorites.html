{% extends 'base.html' %}

{% block title %}Lieblingsdinge{% endblock %}

{% block css %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
{% endblock %}

{% block content %}

<style>

.favorites-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  width: 100%;
  max-width: 900px;
  margin: 30px auto;
}

.favorite-btn {
  aspect-ratio: 4 / 3;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
  border: 4px solid var(--icon-frame-color);
  border-radius: 16px;
  background-color: var(--secondary-color);
  color: #ffffff;
  font-size: 32px;
  font-weight: bold;
  transition: background-color 0.2s, transform 0.1s;
}

.favorite-btn i {
  font-size: 72px;
  color: var(--icon-body-color);
}

.favorite-btn:hover {
  background-color: var(--hover-color);
}

.favorite-btn:active {
  transform: scale(0.97);
}

.favorite-btn.selected {
  background-color: var(--icon-frame-color);
  border-color: var(--hover-color);
}

.favorite-btn.selected i {
  color: #ffffff;
}

@media (max-width: 600px) {
  .favorites-grid { gap: 10px; }
  .favorite-btn { font-size: 16px; border-width: 2px; }
  .favorite-btn i { font-size: 36px; }
}

</style>

<section class="d-flex flex-column align-items-center text-center">

  <h1>Was ist dein Favorit?</h1>

  <div class="favorites-grid">
    <button class="favorite-btn"><i class="bi bi-music-note-beamed"></i>Lied</button>
    <button class="favorite-btn"><i class="bi bi-geo-alt-fill"></i>Ort</button>
    <button class="favorite-btn"><i class="bi bi-box-seam"></i>Python-Bibliothek</button>
    <button class="favorite-btn"><i class="bi bi-film"></i>Film</button>
    <button class="favorite-btn"><i class="bi bi-book"></i>Buch</button>
    <button class="favorite-btn"><i class="bi bi-bicycle"></i>Hobby</button>
    <button class="favorite-btn"><i class="bi bi-tools"></i>Werkzeug</button>
    <button class="favorite-btn"><i class="bi bi-egg-fried"></i>Essen</button>
    <button class="favorite-btn"><i class="bi bi-palette"></i>Künstler*in</button>
  </div>

<script>
document.querySelectorAll(".favorite-btn").forEach(btn => {
  btn.addEventListener("click", () => btn.classList.toggle("selected"));
});
</script>

</section>

{% endblock %}
