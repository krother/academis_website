{% extends 'base.html' %}

{% block title %}Flipping Letters{% endblock %}

{% block content %}

<style>

  section {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .grid {
    display: grid;
    --card: 180px;
    --gap: 15px;
    grid-template-columns: repeat(var(--cols, 6), var(--card));
    grid-template-rows: repeat(var(--rows, 4), var(--card));
    gap: var(--gap);
  }

  .controls {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 15px;
    margin-top: 20px;
  }

  .controls input[type="number"] {
    width: 70px;
  }

  .card {
    perspective: 1000px;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.6s;
    cursor: pointer;
  }

  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: calc(var(--card) / 2);
    border-radius: 10px;
    backface-visibility: hidden;
  }

  .front {
    background: #b3d789;
    color: #000;
  }

  .back {
    background: #3C6F1F;
    transform: rotateY(180deg);
  }
  </style>

<section class="d-flex flex-column align-items-center text-center">

  <h1>Flipping Letters</h1>

  <div class="grid" id="grid"></div>

  <div class="controls">
    <label>Columns
      <input type="number" id="cols" class="form-control d-inline-block" min="3" max="8" value="6">
    </label>
    <label>Rows
      <input type="number" id="rows" class="form-control d-inline-block" min="3" max="6" value="4">
    </label>
    <label>Difficulty
      <select id="difficulty" class="form-select d-inline-block w-auto">
        <option value="easy">easy</option>
        <option value="medium">medium</option>
        <option value="hard">hard</option>
      </select>
    </label>
    <button type="button" id="restart" class="btn btn-success">Restart</button>
  </div>

<script>
  const letters = "INEPBSOSCHAFARWTDEYDNAOTM";
  const grid = document.getElementById("grid");

  const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const POOLS = {
    easy: "ETAOINSHRDLU",
    medium: ALPHABET.replace(/[JVUQZXY]/g, ""),
    hard: ALPHABET,
  };

  function createCard(letter) {
    const card = document.createElement("div");
    card.classList.add("card");

    const inner = document.createElement("div");
    inner.classList.add("card-inner");

    const front = document.createElement("div");
    front.classList.add("card-face", "front");
    front.textContent = letter;

    const back = document.createElement("div");
    back.classList.add("card-face", "back");

    inner.appendChild(front);
    inner.appendChild(back);
    card.appendChild(inner);

    card.addEventListener("click", () => {
      card.classList.toggle("flipped");
    });

    return card;
  }

  function clamp(value, min, max, fallback) {
    const n = parseInt(value, 10);
    return Number.isNaN(n) ? fallback : Math.min(max, Math.max(min, n));
  }

  let gridCols = 6;
  let gridRows = 4;

  // Largest card size (max 180px) that fits the grid into the viewport
  function fitCards() {
    const gap = 15;
    const sideMargin = 40;
    const reservedHeight = 260; // heading, controls and page chrome
    const byWidth = (window.innerWidth - sideMargin - gap * (gridCols - 1)) / gridCols;
    const byHeight = (window.innerHeight - reservedHeight - gap * (gridRows - 1)) / gridRows;
    const size = Math.max(40, Math.min(180, Math.floor(Math.min(byWidth, byHeight))));
    grid.style.setProperty("--card", size + "px");
  }

  window.addEventListener("resize", fitCards);

  function buildGrid(cols, rows, letterAt) {
    gridCols = cols;
    gridRows = rows;
    grid.style.setProperty("--cols", cols);
    grid.style.setProperty("--rows", rows);
    fitCards();
    grid.replaceChildren();
    for (let i = 0; i < cols * rows; i++) {
      grid.appendChild(createCard(letterAt(i)));
    }
  }

  function restart() {
    const colsInput = document.getElementById("cols");
    const rowsInput = document.getElementById("rows");
    const cols = clamp(colsInput.value, 3, 8, 6);
    const rows = clamp(rowsInput.value, 3, 6, 4);
    colsInput.value = cols;
    rowsInput.value = rows;

    const pool = POOLS[document.getElementById("difficulty").value];
    buildGrid(cols, rows, () => pool[Math.floor(Math.random() * pool.length)]);
  }

  document.getElementById("restart").addEventListener("click", restart);

  // Initial game: 6x4 with the fixed letters
  buildGrid(6, 4, i => letters[i % letters.length]);
</script>

{% endblock %}
